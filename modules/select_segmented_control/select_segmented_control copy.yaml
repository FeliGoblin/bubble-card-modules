select_segmented_control:
  name: Select Segmented Control
  version: '1.0'
  creator: FeliGoblin
  supported:
    - select
  description: Test
  code: |
    ${(() => {
      const defaultAnimSpeed = 0.2;

      const moduleID = 'select_segmented_control';
      const config = this.config[moduleID] || {};
      const options = hass.states[entity].attributes?.options ?? [];
      const cardContainer = card.querySelector('.bubble-select-container') ?? null;
     
      if (!entity || !cardContainer) return;
      if (!options.length) {
        console.warn("Empty options list.");
        return;
      }

      cardContainer.querySelector('.bubble-select')?.remove()
      cardContainer.querySelector('.bubble-dropdown-inner-border')?.remove()

      let selectedIndex = options.indexOf(hass.states[entity]?.state);
      const customs = config.button_options ?? null;
      const animSpeed = (config.animation_speed ?? defaultAnimSpeed) + 's';

      let buttonContainer = card.querySelector('.ssc-button-container') ?? null;
      if (!buttonContainer) {
        buttonContainer = document.createElement('div');    
        buttonContainer.classList.add('ssc-button-container');
        cardContainer.appendChild(buttonContainer);
      }
      if (buttonContainer.children?.length != options.length) createButtons();  

      options.forEach((option, index) => {
        buttonContainer.children[index].onclick = function(){selectOption(index, option)};
      });

      let selectedButton = buttonContainer.children[selectedIndex] ?? null;

      let pill = card.querySelector('.ssc-pill') ?? null;
      if (!pill) {
        pill = document.createElement('div', );
        pill.style.transition = 'none';
        pill.classList.add('ssc-pill');
        pill.style.left = selectedButton.offsetLeft + 'px';
        pill.style.width = selectedButton.offsetWidth + 'px';
        cardContainer.appendChild(pill);
      }

      if (!selectedButton.hasAttribute('selected')) stateChanged();

      const resizeObserver = new ResizeObserver(() => {
        pill.style.left = selectedButton.offsetLeft + 'px';
        pill.style.width = selectedButton.offsetWidth + 'px';
      });
      resizeObserver.observe(selectedButton);

      function createButtons() {
        buttonContainer.innerHTML = "";
        options.forEach((option, index) => {        
          let button = document.createElement('div');
          button.toggleAttribute('selected', index === selectedIndex);
          button.classList.add('ssc-button');
          //button.addEventListener("click", function() {
          //  selectOption(index, option);
          //});

          

          if (customs) {
            let custom_values = customs.find(custom_values => custom_values.index === index + 1);

            if (custom_values) {
              
              //custom_values.tap_action?.forEach((tap_action, a_index) => {
              //  let action = tap_action.action?.split(".", 2); 
              //  button.addEventListener('click', (event) => {              
              //    let action = tap_action.action?.split(".", 2);            
              //    hass.callService(action[0], action[1], {...tap_action.target, ...tap_action.data});
              //  });
              //});
              
              if (custom_values.action_every_click && custom_values.tap_action) button.setAttribute('repeat', '');
            
              let icon = custom_values.icon ?? null;
                    
              if (icon) {
                let haIcon = document.createElement('ha-icon');
                haIcon.classList.add('bubble-main-icon', 'bubble-icon', 'icon');
                haIcon.setAttribute('icon', icon);
                haIcon.style.cssText = 'color: inherit; display: inline-block;'

                button.appendChild(haIcon);
                button.setAttribute('icon', icon);
                button.setAttribute('icon_on', custom_values.icon_on ?? "");
              }
              button.append(' ' + (custom_values?.name ?? option));
            } else {
              button.append(option);
            }
          } else {
            button.append(option);
          }
            
          buttonContainer.appendChild(button);
        });
      }

      console.log("test");

      function stateChanged() {
        pill.style.transition = `left ${animSpeed}, width ${animSpeed}`;

        let from = buttonContainer.querySelector('[selected]');
        if (from) {
            from.removeAttribute('selected');
            if (from.hasAttribute('icon')) {
                from.firstChild.setAttribute('icon', from.attributes.icon.value);
            }
        }

        selectedButton.setAttribute('selected', '');
        let iconOn = selectedButton.attributes?.icon_on?.value;
        if (iconOn) selectedButton.firstChild.setAttribute('icon', iconOn);
      }

      function selectOption(index, option) {
        var prevIndex = selectedIndex;
        promise = hass.callService('input_select', 'select_option', {entity_id: entity, option: option});
        if (hass.vibrate) navigator.vibrate(20);
        promise.then(
          function(v) {
            if (prevIndex != index || buttonContainer.children[index]?.hasAttribute('repeat')) {
              console.log(v);
              customActions();
            }
          }
        );
      }

      function customActions() {
        let custom_values = customs.find(custom_values => custom_values.index === selectedIndex + 1);

        if (custom_values) {
          custom_values.tap_action?.forEach((tap_action, a_index) => {
            let action = tap_action.action?.split(".", 2);               
            hass.callService(action[0], action[1], {...tap_action.target, ...tap_action.data});
          });
        }
      }
    })()}

    .bubble-container {
      overflow: hidden;
      border-radius: ${
        this.config.select_segmented_control?.radius?.card == null
          ? '' : `${this.config.select_segmented_control.radius.card}px !important`
      }
    }

    .bubble-wrapper {
      display: none;
    }

    .ssc-button-container {
      display: flex;
      justify-content: space-evenly;
      position: relative;
      height: 100%;
      z-index: 5;
    }

    .ssc-button {
      flex-grow: 1;
      opacity: 0.6;
      line-height: calc(var(--row-height, 56px) * var(--row-size, 1));
      font-size: var(--ha-font-size-m);
      font-weight: bold;
      text-transform: ${
        this.config.select_segmented_control?.text_transform == null ? 'none' 
        : this.config.select_segmented_control.text_transform 
      };
      text-align: center;
      cursor: pointer;
    }

    .ssc-button[selected],
    .ssc-button[selected] ha-icon {
      opacity: 1;
    }

    .ssc-button:hover {
      background: 
        color-mix(
          in oklab, 
          var(--md-ripple-hover-color, 
            var(--ha-ripple-hover-color, 
              var(--ha-ripple-color,
                var(--secondary-text-color)
              )
            )
          ) 3%, 
          transparent
        );
    }

    .bubble-icon {
      width: var(--mdc-icon-size, 24px);
      display: inline-block;
    }

    .ssc-pill {
      background: var(--bubble-button-accent-color, var(--bubble-accent-color, var(--bubble-default-color)));
      height: 100%;
      position: absolute;
      top: 0px;
      transition: none;
      z-index: 0;
    }

    .ssc-button, .ssc-pill {
      border-radius: ${
        this.config.select_segmented_control?.radius?.button == null
          ? 'var(--bubble-border-radius, calc(var(--row-height, 56px) * var(--row-size, 1) / 2))'
          : `${this.config.select_segmented_control.radius.button}px`
      }
    }
  editor:
    - name: text_transform
      label: Text Transform
      selector:
        select:
          options:
            - label: Capitalize
              value: capitalize
            - label: Uppercase
              value: uppercase
            - label: Lowercase
              value: lowercase
          multiple: false
          custom_value: false
          mode: dropdown
    - type: grid
      name: radius
      schema:
        - name: button
          label: Button Border Radius
          selector:
            number:
              step: 1
              unit_of_measurement: px
              mode: box
        - name: card
          label: Card Border Radius
          selector:
            number:
              step: 1
              unit_of_measurement: px
              mode: box
    - name: animation_speed
      label: Animation Speed
      selector:
        number:
          min: 0
          max: 2
          step: 0.1
          unit_of_measurement: s
      default: 0.2
    - name: button_options
      label: Button Customizations
      selector:
        object:
          fields:
            index:
              label: Button Number
              required: true
              description: 1 = first button, 2 = second button, 3 = third, etc.
              selector:
                number:
                  min: 1
                  max: 50
                  step: 1
                  mode: box
            name:
              label: Name
              description: Enter a single space to hide the name.
              selector:
                text: {}
            icon:
              label: Icon
              selector:
                icon: {}
            icon_on:
              label: Selected Icon
              description: Show a different icon when selected.
              selector:
                icon: {}
            tap_action:
              label: Custom Actions
              selector:
                action: {}
            action_every_click:
              label: Trigger Actions on Every Click
              description: Trigger custom actions even when this button option is already selected.
              selector:
                boolean: {}
          label_field: index
          description_field: name
          multiple: true
